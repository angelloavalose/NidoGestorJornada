const {
  useState,
  useMemo,
  useCallback,
  useRef,
  useEffect
} = React;

// ─── CONSTANTES ──────────────────────────────────────────────────────────────
const C = {
  bg: "#F5F5F5",
  surface: "#FFFFFF",
  surfaceHigh: "#F9FAFB",
  border: "#E5E7EB",
  accent: "#1A5C2E",

  warning: "#D97706",
  info: "#1D4ED8",
  ok: "#16A34A"
};
const BRD = `0.5px solid ${C.border}`;
const GER_COLOR = {
  "GESTIÓN HUMANA": "#4A148C",
  "CALIDAD": "#1B5E20",
  "ADMINISTRACIÓN Y FINANZAS": "#1A237E",
  "DIRECCIÓN": "#37474F",
  "CANAL TRADICIONAL": "#B71C1B",
  "CANAL MODERNO": "#E65100"
};
const DIAS_SEMANA = ["Dom", "Lun", "Mar", "Mié", "Jue", "Vie", "Sáb"];
const ESTADO_STYLE = {
  OK:        {bg:"#F0FDF4", color:"#15803D", label:"Marc. completa"},
  TARDANZA:  {bg:"#FEF3C7", color:"#92400E", label:"Tardanza"},

  ABSENTISMO:{bg:"#EDE9FE", color:"#5B21B6", label:"Absentismo"},
  DESCANSO:  {bg:"#F3F4F6", color:"#D1D5DB", label:"Descanso"},
  REMOTO:    {bg:"#D1FAE5", color:"#065F46", label:"Remoto"},
  TARD_TOL:  {bg:"#FEF9C3", color:"#854D0E", label:"Tard. tolerada"},
  DESC_TRAB: {bg:"#E0F2FE", color:"#075985", label:"Descanso trabajado"},
  FER_TRAB:  {bg:"#E0F2FE", color:"#075985", label:"Feriado trabajado"},
};

// ─── UTILS ───────────────────────────────────────────────────────────────────
function fmtH(h) {
  if (h === null || h === undefined || isNaN(h)) return "—";
  const neg = h < 0;
  const abs = Math.abs(h);
  const hh = Math.floor(abs);
  const mm = Math.round((abs - hh) * 60);
  return `${neg ? "-" : ""}${String(hh).padStart(2,"0")}:${String(mm).padStart(2,"0")}`;
}
function fmtMin(m) {
  if (!m || m <= 0) return "—";
  return `${String(Math.floor(m / 60)).padStart(2, "0")}:${String(m % 60).padStart(2, "0")}`;
}
// Celda de minutos en tablas diarias: valor, "00:00" si el día aplica y es cero, "—" si no aplica (descanso, feriado, absentismo)
function minDia(d, campo) {
  const v = d[campo] || 0;
  if (v > 0) return fmtMin(v);
  if (["DESCANSO", "FERIADO", "ABSENTISMO"].includes(d.estado)) return "—";
  if ((d.estado === "DESC_TRAB" || d.estado === "FER_TRAB") && campo !== "trab_min") return "—";
  return "00:00";
}
function minToHHMM(m) {
  if (m === null || m === undefined) return "—";
  const mReal = m >= 1440 ? m % 1440 : m; // turno nocturno: mostrar hora real del día
  return `${String(Math.floor(mReal / 60)).padStart(2, "0")}:${String(mReal % 60).padStart(2, "0")}`;
}
function fmtPct(p) {
  return `${parseFloat(p || 0).toFixed(1)}%`;
}
function fmtFecha(d) {
  if (!d) return "—";
  const dt = new Date(d + "T12:00:00");
  return `${String(dt.getDate()).padStart(2, "0")}/${String(dt.getMonth() + 1).padStart(2, "0")}/${dt.getFullYear()}`;
}
function fmtFechaCorta(d) {
  if (!d) return "—";
  const dt = new Date(d + "T12:00:00");
  return `${String(dt.getDate()).padStart(2, "0")}/${String(dt.getMonth() + 1).padStart(2, "0")}`;
}

// ─── PARSERS ─────────────────────────────────────────────────────────────────
function excelDateToISO(val) {
  if (!val && val !== 0) return null;
  if (val instanceof Date) {
    if (isNaN(val.getTime())) return null;
    const y = val.getUTCFullYear(),
      m = val.getUTCMonth() + 1,
      d = val.getUTCDate();
    if (y < 2000 || y > 2100) return null;
    return `${y}-${String(m).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
  }
  if (typeof val === "number" && val > 1 && val < 60000) {
    const ms = (val - 25569) * 86400000;
    const d = new Date(ms);
    const y = d.getUTCFullYear(),
      mo = d.getUTCMonth() + 1,
      dy = d.getUTCDate();
    if (y < 2000 || y > 2100) return null;
    return `${y}-${String(mo).padStart(2, "0")}-${String(dy).padStart(2, "0")}`;
  }
  if (typeof val === "string") {
    const m = val.match(/^(\d{4})-(\d{2})-(\d{2})T/);
    if (m && parseInt(m[1]) > 2000) return `${m[1]}-${m[2]}-${m[3]}`;
    const m2 = val.match(/^(\d{4})-(\d{2})-(\d{2})$/);
    if (m2 && parseInt(m2[1]) > 2000) return `${m2[1]}-${m2[2]}-${m2[3]}`;
  }
  return null;
}
function parseTimeToMin(val) {
  if (val === null || val === undefined || val === "") return null;
  if (val instanceof Date) return val.getHours() * 60 + val.getMinutes();
  if (typeof val === "number") {
    if (val > 0 && val < 1) return Math.round(val * 1440);
    return null;
  }
  const s = String(val).trim();
  if (!s || s === "NaN" || s === "-" || s === "null") return null;
  const m = s.match(/^(\d{1,2}):(\d{2})(?::(\d{2}))?\s*(AM|PM)?$/i);
  if (m) {
    let h = parseInt(m[1]),
      mm = parseInt(m[2]);
    if (m[4] && m[4].toUpperCase() === "PM" && h < 12) h += 12;
    return h * 60 + mm;
  }
  return null;
}
// Déficit 48h por período (hasta la fecha de corte):
// (días hábiles × 48h / días que trabaja por semana) − H.Debidas
// Días hábiles = días programados sin absentismo, feriado ni descanso
// Absentismo injustificado (falta, inasistencia, suspensión): no justifica el día → cuenta como deuda
function esAbsInjustificado(txt) {
  const s = String(txt || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
  return s.includes("injustific") || s.includes("inasist") || s.includes("suspens") || (s.includes("falta") && !s.includes("justific"));
}
function semanaLunes(fecha) {
  const dt = new Date(fecha + "T12:00:00");
  const dow = (dt.getDay() + 6) % 7; // 0 = lunes
  dt.setDate(dt.getDate() - dow);
  return `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, "0")}-${String(dt.getDate()).padStart(2, "0")}`;
}
// Días que trabaja por semana según su programación (semana completa más frecuente)
function calcDiasSemana(fechas, prog) {
  // Semanas completas (lun-dom): firma de qué días de la semana tiene programados
  const sem = {};
  fechas.forEach(f => {
    const k = semanaLunes(f);
    if (!sem[k]) sem[k] = { dias: 0, prog: 0, firma: [] };
    sem[k].dias++;
    const hor = prog[f];
    if (hor && hor.tipo !== "DESCANSO") { sem[k].prog++; sem[k].firma.push((new Date(f + "T12:00:00").getDay() + 6) % 7); }
  });
  const comp = Object.values(sem).filter(s => s.dias === 7 && s.prog > 0);
  if (comp.length) {
    const firmas = {};
    comp.forEach(s => { const f = s.firma.sort().join(","); firmas[f] = (firmas[f] || 0) + 1; });
    const [fTop, nTop] = Object.entries(firmas).sort((a, b) => b[1] - a[1])[0];
    // Horario fijo: la misma semana se repite en ≥75% de las semanas completas → sus días
    if (nTop / comp.length >= 0.75) return fTop.split(",").length;
    // Turno rotativo (ej. 4x2): promedio de días programados por semana completa
    return parseFloat((comp.reduce((s, x) => s + x.prog, 0) / comp.length).toFixed(2));
  }
  let totD = 0, totP = 0;
  Object.values(sem).forEach(s => { totD += s.dias; totP += s.prog; });
  return totD > 0 ? Math.max(1, Math.min(7, Math.round(totP / totD * 7))) : 5;
}
function calcDeficit48(tareoArr, diasSem) {
  const ds = diasSem || 5;
  let hab = 0, prog = 0;
  (tareoArr || []).forEach(d => {
    const pd = d.progDef || 0;
    if (pd <= 0) return;
    if (["ABSENTISMO", "FERIADO", "DESCANSO", "FER_TRAB", "DESC_TRAB"].includes(d.estado)) return;
    hab++;
    prog += pd;
  });
  const tope = hab * 48 * 60 / ds;
  const min = Math.max(0, tope - prog);
  const semanalMin = hab > 0 ? Math.max(0, 48 * 60 - (prog / hab) * ds) : 0;
  return { min, semanalMin, hab, tope };
}
function parseHorario(s) {
  s = String(s || "").trim();
  const sUp = s.toUpperCase();
  if (!s || sUp === "DESCANSO" || sUp === "DSO" || sUp === "NAN" || s === "-" || s === "") return {
    tipo: "DESCANSO"
  };
  const remoto = sUp.includes("REMOTO");
  const tiempos = [];
  const reT = /(\d{1,2}):(\d{2})/g;
  let mt;
  while ((mt = reT.exec(s)) !== null) tiempos.push({
    h: parseInt(mt[1]),
    m: parseInt(mt[2])
  });
  if (tiempos.length < 2) return {
    tipo: "DESCANSO"
  };
  const hasPM = /pm/i.test(s);
  let ingH = tiempos[0].h,
    ingM = tiempos[0].m;
  let salH = tiempos[tiempos.length - 1].h,
    salM = tiempos[tiempos.length - 1].m;
  if (hasPM && salH < 12) salH += 12;
  const ing = ingH * 60 + ingM;
  let sal = salH * 60 + salM;
  if (sal <= ing) sal += 1440;
  return {
    tipo: remoto ? "REMOTO" : "PRESENCIAL",
    ing,
    sal,
    jornada: sal - ing,
    horStr: s.toUpperCase()
  };
}

// ─── PROCESADOR ──────────────────────────────────────────────────────────────
function procesarDatos(files, fechaCorte) {
  const leerRaw = file => {
    const wb = XLSX.read(file._ab, {
      type: "array",
      cellDates: true
    });
    const ws = wb.Sheets[wb.SheetNames[0]];
    return XLSX.utils.sheet_to_json(ws, {
      header: 1,
      raw: true,
      defval: null
    });
  };
  const leerNoRaw = file => {
    const wb = XLSX.read(file._ab, {
      type: "array",
      cellDates: true
    });
    const ws = wb.Sheets[wb.SheetNames[0]];
    return XLSX.utils.sheet_to_json(ws, {
      header: 1,
      raw: false,
      defval: ""
    });
  };

  // BASE
  const rawBase = leerRaw(files.base);
  const hBase = rawBase[0].map(h => String(h || "").trim());
  const iBC = hBase.findIndex(h => h.includes("Cód. Trab"));
  const iBN = hBase.findIndex(h => h.includes("Nombres"));
  const iBAP = hBase.findIndex(h => h.includes("Apellido Pat"));
  const iBAM = hBase.findIndex(h => h.includes("Apellido Mat"));
  const iBG = hBase.findIndex(h => h.includes("Gerencia"));
  const iBUO = hBase.findIndex(h => h.includes("Unid. Org"));
  const iBP = hBase.findIndex(h => h.includes("Posición"));
  const iBFI = hBase.findIndex(h => h.includes("Fe. Ingreso") || h.includes("Ingreso"));
  const iBFC = hBase.findIndex(h => h.includes("Fe. Cese") || h.includes("Cese"));
  const baseMap = {};
  rawBase.slice(1).forEach(r => {
    const cod = parseInt(String(r[iBC] || "").replace(/\D/g, ""));
    if (!cod || isNaN(cod)) return;
    baseMap[cod] = {
      nombre: `${r[iBAP] || ""} ${r[iBAM] || ""} ${r[iBN] || ""}`.replace(/\s+/g, " ").trim(),
      gerencia: String(r[iBG] || "").trim().toUpperCase(),
      uo: String(r[iBUO] || "").trim(),
      pos: String(r[iBP] || "").trim(),
      fe_ingreso: excelDateToISO(r[iBFI]) || null,
      fe_cese: excelDateToISO(r[iBFC]) || null
    };
  });

  // PROGRAMACIÓN
  const rawProgRaw = leerRaw(files.prog);
  let hRowProg = 0;
  for (let i = 0; i < Math.min(rawProgRaw.length, 5); i++) {
    if (rawProgRaw[i].some(c => String(c || "").toUpperCase().includes("CÓD") || String(c || "").toUpperCase().includes("GERENCIA"))) {
      hRowProg = i;
      break;
    }
  }
  const hProgRaw = rawProgRaw[hRowProg];
  const rawProgNoRaw = leerNoRaw(files.prog);
  const hProgStr = rawProgNoRaw[hRowProg].map(h => String(h || "").trim());
  const iPC = hProgStr.findIndex(h => h.toUpperCase().includes("CÓD") || h.toUpperCase().includes("COD"));
  const iDSO = hProgStr.findIndex(h => h.toUpperCase() === "DSO");
  const iPPos = hProgStr.findIndex(h => h.toUpperCase().includes("POSICIÓN") || h.toUpperCase().includes("POSICION"));

  // Detectar columnas de fecha
  const fechaCols = [];
  hProgRaw.forEach((val, i) => {
    if (i <= Math.max(iDSO, iPPos, iPC)) return;
    const iso = excelDateToISO(val);
    if (iso) fechaCols.push({
      col: i,
      fecha: iso
    });
  });

  // Aplicar fecha de corte
  const fechasCols = fechaCorte ? fechaCols.filter(f => f.fecha <= fechaCorte) : fechaCols;
  const periodo = {
    inicio: fechasCols.length > 0 ? fechasCols[0].fecha : null,
    fin: fechaCorte || (fechaCols.length > 0 ? fechaCols[fechaCols.length - 1].fecha : null),
    finOriginal: fechaCols.length > 0 ? fechaCols[fechaCols.length - 1].fecha : null
  };

  // Construir progMap
  const progMap = {};
  rawProgNoRaw.slice(hRowProg + 1).forEach(r => {
    const cod = parseInt(String(r[iPC] || "").replace(/\D/g, ""));
    if (!cod || isNaN(cod)) return;
    progMap[cod] = {};
    fechasCols.forEach(({
      col,
      fecha
    }) => {
      progMap[cod][fecha] = parseHorario(r[col]);
    });
  });

  // FERIADOS
  const rawFer = leerRaw(files.feriados);
  const ferSet = new Set();
  rawFer.slice(1).forEach(r => {
    const iso = excelDateToISO(r[0]);
    if (iso) ferSet.add(iso);
  });

  // TELETRABAJO — cod -> Set<fecha>
  const refrigerioMap = {};
  if (files.refrigerio) {
    const rawRef = leerRaw(files.refrigerio);
    const hRef = rawRef[0].map(h => String(h || "").trim());
    const iRHor = hRef.findIndex(h => h.toLowerCase().includes("horario"));
    const iRMin = hRef.findIndex(h => h.toLowerCase().includes("refrigerio"));
    rawRef.slice(1).forEach(r => {
      const hor = String(r[iRHor] || "").trim().toUpperCase();
      const minVal = r[iRMin];
      let mins = null;
      if (minVal instanceof Date) mins = minVal.getHours() * 60 + minVal.getMinutes();
      else if (typeof minVal === "number" && minVal >= 0 && minVal < 1) mins = Math.round(minVal * 1440);
      else if (typeof minVal === "number" && minVal >= 1 && minVal <= 240) mins = Math.round(minVal); // escrito en minutos
      else if (typeof minVal === "string" && /^\s*\d{1,2}:\d{2}/.test(minVal)) { const [a, b] = minVal.trim().split(":"); mins = parseInt(a) * 60 + parseInt(b); }
      // Se guarda también 00:00: el horario existe en el archivo y su refrigerio es 0
      if (hor && mins !== null && !isNaN(mins)) refrigerioMap[hor] = mins;
    });
  }
  const teleMap = {};
  if (files.teletrabajo) {
    const rawTele = leerRaw(files.teletrabajo);
    const hTele = rawTele[0].map(h => String(h || "").trim());
    const iTCod = hTele.findIndex(h => h.includes("Cód"));
    const iTFec = hTele.findIndex(h => h.includes("Fecha"));
    rawTele.slice(1).forEach(r => {
      const cod = parseInt(String(r[iTCod] || "").replace(/\D/g, ""));
      const iso = excelDateToISO(r[iTFec]);
      if (!cod || isNaN(cod) || !iso) return;
      if (!teleMap[cod]) teleMap[cod] = new Set();
      teleMap[cod].add(iso);
    });
  }

  // ABSENTISMOS
  const rawAbs = leerRaw(files.absentismos);
  const hAbsR = rawAbs[0].map(h => String(h || "").trim());
  const iACod = hAbsR.findIndex(h => h.includes("Cód"));
  const iAFec = hAbsR.findIndex(h => h.includes("Fecha"));
  const iATxt = hAbsR.findIndex(h => h.includes("Txt") || h.includes("explicativo") || h.includes("Descrip"));
  const absMap = {};
  rawAbs.slice(1).forEach(r => {
    const cod = parseInt(String(r[iACod] || "").replace(/\D/g, ""));
    const iso = excelDateToISO(r[iAFec]);
    if (!cod || !iso) return;
    if (!absMap[cod]) absMap[cod] = {};
    absMap[cod][iso] = String(r[iATxt] || "Absentismo");
  });

  // MARCACIONES
  const rawMarcRaw = leerRaw(files.marcaciones);
  const hMarcR = rawMarcRaw[0].map(h => String(h || "").trim());
  const iMFec = hMarcR.findIndex(h => h.includes("Fecha"));
  const iMCod = hMarcR.findIndex(h => h.includes("Cód"));
  const iMIng = hMarcR.findIndex(h => h.toLowerCase().includes("ingreso"));
  const iMSal = hMarcR.findIndex(h => h.toLowerCase().includes("salida"));
  const marcRaw = {};
  rawMarcRaw.slice(1).forEach(r => {
    const cod = parseInt(String(r[iMCod] || "").replace(/\D/g, ""));
    const iso = excelDateToISO(r[iMFec]);
    if (!cod || isNaN(cod) || !iso) return;
    if (!marcRaw[cod]) marcRaw[cod] = {};
    if (!marcRaw[cod][iso]) marcRaw[cod][iso] = {
      ings: [],
      sals: []
    };
    const ing = parseTimeToMin(r[iMIng]);
    const sal = parseTimeToMin(r[iMSal]);
    if (ing !== null) marcRaw[cod][iso].ings.push(ing);
    if (sal !== null) marcRaw[cod][iso].sals.push(sal);
  });

  // Consolidar marcaciones
  const marcMap = {};
  Object.keys(marcRaw).forEach(cod => {
    marcMap[parseInt(cod)] = {};
    Object.keys(marcRaw[cod]).forEach(fecha => {
      const {
        ings,
        sals
      } = marcRaw[cod][fecha];
      marcMap[parseInt(cod)][fecha] = {
        ing: ings.length > 0 ? Math.min(...ings) : null,
        sal: sals.length > 0 ? Math.max(...sals) : null
      };
    });
  });

  // CALCULAR POR COLABORADOR

      const hProgMin = hor.jornada; // jornada bruta = sal - ing

  const progSet = new Set(codsActivos);

  if (marcSinProg.length) alertas.push({ nivel: "aviso", msg: `${marcSinProg.length} código(s) tienen marcaciones pero no están en Programación (no se analizan)`, detalle: marcSinProg.map(c => baseMap[c] ? `${c} · ${baseMap[c].nombre}` : String(c)) });

    colaboradores,
    periodo,
    alertas,
    gerencias: [...new Set(colaboradores.map(c => c.gerencia))]

}

// ─── RECÁLCULO ÚNICO (corte + tolerancia) ─────────────────────────────────────
// Todos los totales salen del tareo diario con estas mismas reglas, así la carga inicial,
// el cambio de fecha de corte y la tolerancia dan siempre el mismo resultado.
function hhmmAMin(s) {
  if (!s || typeof s !== "string" || !s.includes(":")) return null;

function aplicarTolerancia(d, tol) {

  if (!["OK", "TARDANZA", "TARD_ANTIC", "ANTICIPADA", "MARC_INC"].includes(d.estado)) return d;
  const nd = { ...d, tard_min: 0, tol_min: d.tard_min };
  if (d.estado === "TARDANZA") nd.estado = "TARD_TOL";
  if (d.estado === "TARD_ANTIC") nd.estado = "ANTICIPADA";
  return nd;
}
function resumirColab(c, fechaFin, tol, fechaIni) {

  tareo.forEach(d => {
    if (d.estado === "DESCANSO") { d_desc++; return; }
    if (d.estado === "DESC_TRAB") { d_desc++; d_desc_trab++; h_hhee += (d.hhee_min || 0) / 60; return; }

    if (d.estado === "FER_TRAB") { d_fer++; d_fer_trab++; h_hhee += (d.hhee_min || 0) / 60; return; }
    if (d.estado === "ABSENTISMO") { if (d.tipo === "DESCANSO") d_desc++; else if (d.esFer) d_fer++; else d_abs++; return; }
    d_lab++;
    if (d.absObs) d_abs++;
